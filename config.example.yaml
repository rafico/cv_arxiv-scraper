email:
  recipient: ""
  subject_prefix: ArXiv Digest
digest:
  # Weekdays the scheduled/cron digest is sent (the manual "Send Test Digest"
  # button ignores this). Default: every day.
  weekdays: [mon, tue, wed, thu, fri, sat, sun]
  # Papers scoring below this combined relevance score are left out of the email.
  min_score: 0.0
  # Maximum papers per digest email (1-100).
  max_papers: 15
  # Base URL for the one-tap Save/Skip links inside the email. Must be reachable
  # from the device you read email on; defaults to this app's local dev server.
  base_url: http://127.0.0.1:5000
scraper:
  feed_url: https://rss.arxiv.org/rss/cs.CV
  # How many days back the arXiv-API fallback fetches when the daily RSS feed is
  # thin/empty. 4 keeps the window overlapping the previous announcement even across
  # a long holiday weekend (e.g. Juneteenth + Sat/Sun); dedup prevents re-ingesting.
  rolling_window_days: 4
  max_workers: 8
  pdf_attempts: 2
  pdf_lines_start: 2
  pdf_max_header_lines: 50
  pdf_smart_header: true
  thumbnail_dpi: 150
  # Full-text section extraction (arXiv HTML first, pdfplumber fallback). Stores
  # PaperSection rows, which are what "Ask this paper", corpus chat and citation
  # verification read — leave it on unless you only want titles/abstracts. Costs
  # roughly one extra HTTP fetch per new paper; the stage is deadline-bounded and
  # non-fatal, so a slow run skips the remainder instead of failing the scrape.
  extract_sections: true
  # Inline figure previews on cards and in the digest. Best-effort, capped per run
  # and deadline-bounded; set false to skip figure fetching entirely.
  extract_figures: true
ingest:
  backends:
    - rss
    - arxiv_api
llm:
  enabled: false
  # One combined JSON call per paper that also extracts tasks, datasets,
  # method type, backbone, and a "why this matched you" line.
  structured_insights: false
  provider: ollama
  model: gemma4:e2b
  base_url: http://localhost:11434/v1
  max_concurrent: 1
openalex:
  enabled: true
  # Contact email sent as ?mailto= (polite pool). OpenAlex also requires a free
  # API key since Feb 2026 — save it in Settings -> Automation -> Data Sources
  # (stored as the gitignored .openalex_api_key dotfile) or set the
  # OPENALEX_API_KEY env var. Never put the key in this file.
  email: ""
github:
  enabled: true
  # Optional personal access token (or set GITHUB_TOKEN, or save one in
  # Settings -> Automation -> Data Sources / the .github_token dotfile) to raise
  # the API rate limit from 60 to 5000 requests/hour. Without it, fetches are
  # capped per run.
  token: ""
# Semantic Scholar citation lookups are keyless by default; a key (issued at
# ~1 req/s) is stored as the .s2_api_key dotfile via Settings -> Automation ->
# Data Sources or the SEMANTIC_SCHOLAR_API_KEY env var — never in this file.
preferences:
  ranking:
    author_weight: 44.0
    affiliation_weight: 26.0
    title_weight: 14.0
    ai_weight: 5.0
    citation_weight: 0.05
    venue_weight: 8.0
    # Learned interest signal (see preferences.learned below); inert until
    # >= 5 saved papers have embeddings. This weight multiplies the signal.
    interest_weight: 12.0
    # Implementation-readiness boost: a small additive bonus for "runnable"
    # papers, from already-extracted signals (has-code repo + star count +
    # license + repo freshness, plus project page / HF upvotes). Scaled by the
    # 0-100 readiness score, so this weight is the *maximum* points it can add.
    # Deliberately small so it never overrides the learned interest signal.
    readiness_weight: 2.0
    freshness_half_life_days: 14.0
  learned:
    # Learned ranking: a per-user logistic regression over PCA-compressed
    # paper embeddings (the Scholar Inbox recipe), retrained automatically on
    # every save/skip. Until enough rated papers exist it falls back to the
    # centroid interest profile, so new installs behave exactly as before.
    enabled: true
    # Blend inside the "Learned interests" signal once the model is active:
    # 0 = centroid profile only, 1 = learned model only.
    blend: 0.7
    # Dense-retrieval candidates: papers with NO whitelist match are admitted
    # to the feed (match type "Interest") when the model scores them above
    # this probability threshold — at most candidate_top_k per scrape.
    # Set candidate_top_k: 0 to keep the feed whitelist-only.
    candidate_threshold: 0.6
    candidate_top_k: 10
    # Multiple interest profiles (e.g. "3D reconstruction" vs "VLM efficiency"),
    # each with its own learned ranker, feed tab, and digest section, are managed
    # in the UI (Settings > Ranking > Interest profiles) and stored per-profile in
    # the database — there are intentionally no per-profile config keys here. The
    # `blend`/`candidate_*` knobs above apply to whichever profile is active.
  muted:
    authors: []
    affiliations: []
    topics: []
# These are computer-vision examples — replace them with YOUR own interests
# (or edit them later in the UI under Settings > Research Setup).
